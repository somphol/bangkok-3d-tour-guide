name: Bug report
description: Report a reproducible problem in Bangkok 3D.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please read SUPPORT.md and TESTING.md first, and do not include private notes, tokens or personal travel data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: Dragging in Walk mode turns the camera, but the walk hint never disappears.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the live demo
        2. Press 2 for Walk
        3. Drag from left to right
        4. ...
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Camera mode
      options:
        - Drone
        - Walk
        - Transit
        - Interface / drawer / data
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Thai
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and device
      placeholder: Chrome 156, macOS 15, MacBook Air M2
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport / zoom
      placeholder: 1600 × 900 at 100%
  - type: dropdown
    id: selftest
    attributes:
      label: Does ?selftest=1 pass?
      options:
        - "Yes — 24 / 24"
        - "No — a check fails"
        - "I did not run it"
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste the relevant DevTools Console output. Redact anything private.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context
      description: Drag in a screenshot or recording if useful. Do not attach a personal itinerary.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation first.
          required: true
        - label: I removed private notes and credentials from anything attached.
          required: true
